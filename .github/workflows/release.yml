# Builds a release of the module whenever a version tag is pushed (git tag v1.2.0 && git push --tags).
#
# Foundry installs and updates a module from the "manifest" URL in its module.json. This
# workflow rewrites that URL (and the download URL) to point at THIS repository's latest
# release, zips the module, and attaches both files to a new GitHub release, so the manifest
# URL  https://github.com/<owner>/<repo>/releases/latest/download/module.json  always serves
# the newest version. Nothing here needs a secret: GITHUB_TOKEN is provided by GitHub.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check the tag matches module.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(jq -r .version module.json)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module.json version ${FILE_VERSION}. Bump module.json first."
            exit 1
          fi

      - name: Point the manifest at this release, and build the zip
        run: |
          REPO="${GITHUB_REPOSITORY}"
          jq --arg manifest "https://github.com/${REPO}/releases/latest/download/module.json" \
             --arg download "https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/module.zip" \
             --arg url "https://github.com/${REPO}" \
             '.manifest = $manifest | .download = $download | .url = $url' module.json > module.json.tmp
          mv module.json.tmp module.json
          zip -r module.zip module.json README.md CHANGELOG.md lang scripts styles

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
